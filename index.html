<!DOCTYPE html>
<html>
  <head>
    <title>Fashion Try-On</title>
  </head>
  <body>
    <h1>Fashion Try-On</h1>
    <p>Enter your measurements in inches.</p>

    <p>Height: <input id="height" type="number"></p>
    <p>Chest: <input id="chest" type="number"></p>
    <p>Waist: <input id="waist" type="number"></p>
    <p>Hips: <input id="hips" type="number"></p>
    <p>Inseam: <input id="inseam" type="number"></p>

    <button onclick="showResult()">See my fit</button>
    <h2>Basic T-Shirt, size M</h2>
    <p id="result"></p>

    <svg width="200" height="380" viewBox="0 0 200 380">
      <circle cx="100" cy="35" r="25" fill="#ddd"/>
      <rect x="35" y="80" width="22" height="110" rx="10" fill="#ddd"/>
      <rect x="143" y="80" width="22" height="110" rx="10" fill="#ddd"/>
      <rect id="chestZone" x="60" y="75" width="80" height="60" rx="10" fill="#ddd"/>
      <rect id="waistZone" x="65" y="135" width="70" height="55" rx="10" fill="#ddd"/>
      <rect x="68" y="190" width="30" height="180" rx="10" fill="#ddd"/>
      <rect x="102" y="190" width="30" height="180" rx="10" fill="#ddd"/>
    </svg>

    <script>
      // The garment's measurements (in inches)
      var shirt = { chest: 42, waist: 40 };

      // Turns the extra room into a word
      function fitWord(garment, body) {
        var room = garment - body;
        if (room < 1) return "Tight";
        if (room <= 4) return "Snug";
        return "Loose";
      }

      // Each word gets a color
      var colors = { Tight: "#e74c3c", Snug: "#2ecc71", Loose: "#3498db" };

      function showResult() {
        var chest = Number(document.getElementById("chest").value);
        var waist = Number(document.getElementById("waist").value);
        var chestFit = fitWord(shirt.chest, chest);
        var waistFit = fitWord(shirt.waist, waist);

        document.getElementById("result").innerText =
          "Chest: " + chestFit + " | Waist: " + waistFit;

        document.getElementById("chestZone").setAttribute("fill", colors[chestFit]);
        document.getElementById("waistZone").setAttribute("fill", colors[waistFit]);
      }
    </script>
  </body>
</html>
